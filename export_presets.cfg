[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, tools/*, build/*, Sounds/Selected/*, Sounds/Music/ogg/Dark *, Sounds/Music/ogg/Light *, Sounds/Music/ogg/Action 1.ogg, Sounds/Music/ogg/Action 3.ogg, Sounds/Music/ogg/Action 4.ogg, Sounds/Music/ogg/Action 5.ogg, Sounds/Music/ogg/Ambient 1?.ogg, Sounds/Music/ogg/Ambient 2.ogg, Sounds/Music/ogg/Ambient 3.ogg, Sounds/Music/ogg/Ambient 4.ogg, Sounds/Music/ogg/Ambient 5.ogg, Sounds/Music/ogg/Ambient 6.ogg, Sounds/Music/ogg/Ambient 7.ogg, Sounds/Music/ogg/Ambient 8.ogg, Sounds/Music/ogg/Ambient 9.ogg"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
// The game at the project's 16:9 (1152x648), as the editor's embedded view keeps it, or 9:16 in a tab
// taller than wide: the largest such box the tab holds, centred on black, at the screen's own pixels.
// Godot reads the canvas's size each frame (canvas_resize_policy 0) and maps the pointer through its
// on-screen rectangle.
function fitCanvas() {
	const canvas = document.getElementById('canvas');
	const [across, down] = window.innerHeight > window.innerWidth ? [9, 16] : [16, 9];
	const unit = Math.min(window.innerWidth / across, window.innerHeight / down);
	const width = Math.floor(across * unit), height = Math.floor(down * unit);
	const ratio = window.devicePixelRatio || 1;
	Object.assign(canvas.style, { position: 'absolute', width: width + 'px', height: height + 'px',
		left: Math.floor((window.innerWidth - width) / 2) + 'px', top: Math.floor((window.innerHeight - height) / 2) + 'px' });
	canvas.width = Math.round(width * ratio);
	canvas.height = Math.round(height * ratio);
}
window.addEventListener('DOMContentLoaded', fitCanvas);
window.addEventListener('resize', fitCanvas);
</script>"
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
